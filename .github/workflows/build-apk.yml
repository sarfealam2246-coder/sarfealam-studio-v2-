name: Build Sarfealam Studio V2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract & Prepare Offline SPA
        run: |
          unzip -o grok-workspace.zip "src/*" "public/*" "package.json" "package-lock.json" "tsconfig.json"
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <title>Sarfealam Auto-Studio</title>
              <meta name="theme-color" content="#070b12" />
              <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="/src/main.apk.tsx"></script>
            </body>
          </html>
          EOF

          cat << 'EOF' > vite.apk.config.ts
          import { resolve } from "node:path";
          import { defineConfig } from "vite";
          import viteReact from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";

          export default defineConfig({
            plugins: [viteReact(), tailwindcss()],
            resolve: { alias: { "@": resolve(__dirname, "src") } },
            build: { outDir: "dist", emptyOutDir: true },
          });
          EOF

          cat << 'EOF' > src/main.apk.tsx
          import { StrictMode } from "react";
          import { createRoot } from "react-dom/client";
          import { createMemoryHistory, createRootRoute, createRoute, createRouter, Outlet, RouterProvider } from "@tanstack/react-router";
          import { AuthProvider } from "@/lib/auth/provider";
          import { StudioApp } from "@/components/studio/StudioApp";
          import "./styles.css";

          const rootRoute = createRootRoute({ component: () => <AuthProvider><Outlet /></AuthProvider> });
          const TABS = ["copilot", "build", "vault", "admin", "skills", "secrets"] as const;
          const indexRoute = createRoute({
            getParentRoute: () => rootRoute,
            path: "/",
            validateSearch: (s: Record<string, unknown>) => ({
              tab: TABS.includes(s.tab as any) ? (s.tab as any) : "copilot",
              build: typeof s.build === "string" ? s.build : "",
            }),
            component: StudioApp,
          });
          const router = createRouter({
            routeTree: rootRoute.addChildren([indexRoute]),
            history: createMemoryHistory({ initialEntries: ["/"] }),
          });

          createRoot(document.getElementById("root")!).render(
            <StrictMode>
              <RouterProvider router={router} />
            </StrictMode>
          );
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build Web & Android APK
        run: |
          npm install --legacy-peer-deps
          npx vite build --config vite.apk.config.ts
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Sarfealam Auto-Studio" "com.sarfealam.autostudiov2" --web-dir dist || true
          npx cap add android || true
          npx cap sync android
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sarfealam-auto-studio-v2-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-${{ github.run_number }}
          name: Sarfealam Studio V2 APK #${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
